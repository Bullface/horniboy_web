name: Worker runtime and browser smoke
on:
  push:
  workflow_dispatch:
jobs:
  worker-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false wrangler@4 playwright@1.56.1
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - run: npx playwright install --with-deps chromium
      - name: Run local Worker and browser
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/horniboy-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; cat /tmp/horniboy-worker.log' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/config >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/api/config
          node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: worker-browser-smoke
          path: worker-smoke.png
          if-no-files-found: error
