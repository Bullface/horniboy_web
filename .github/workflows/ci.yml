name: Horniboy checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: horniboy-build
          path: dist/
          if-no-files-found: error
